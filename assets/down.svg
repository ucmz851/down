<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151922"/>
      <stop offset="100%" stop-color="#0b0d13"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3549"/>
      <stop offset="100%" stop-color="#141923"/>
    </linearGradient>

    <!-- Neon Speed Gradient -->
    <linearGradient id="streamGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="35%" stop-color="#00D2FF"/>
      <stop offset="70%" stop-color="#0072FF"/>
      <stop offset="100%" stop-color="#7000FF"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Surface -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Multi-Stream Accelerating Chevron Glyph -->
  <g filter="url(#neonGlow)" stroke="url(#streamGrad)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Stream 1 (Far Left / Deep Path) -->
    <path d="M 200 90 L 170 140 L 170 270 L 256 356" stroke-width="14"/>

    <!-- Stream 2 (Mid-Left Path) -->
    <path d="M 250 90 L 210 160 L 210 270 L 256 316" stroke-width="14"/>

    <!-- Stream 3 (Center Stream) -->
    <path d="M 256 120 L 256 276" stroke-width="14"/>

    <!-- Stream 4 (Mid-Right Path) -->
    <path d="M 300 90 L 302 160 L 302 270 L 256 316" stroke-width="14"/>

    <!-- Stream 5 (Far Right / Intake Path) -->
    <path d="M 350 90 L 342 140 L 342 270 L 256 356" stroke-width="14"/>

    <!-- Speed Intake Dashes (Parallel Connections In-Flight) -->
    <line x1="200" y1="90" x2="220" y2="55" stroke-width="10" opacity="0.8"/>
    <line x1="250" y1="90" x2="270" y2="55" stroke-width="10" opacity="0.8"/>
    <line x1="300" y1="90" x2="320" y2="55" stroke-width="10" opacity="0.8"/>
    <line x1="350" y1="90" x2="370" y2="55" stroke-width="10" opacity="0.8"/>

    <!-- Outer Kinetic Arrow Wings -->
    <path d="M 120 280 L 256 416 L 392 280" stroke-width="20" stroke-linecap="round"/>
    <path d="M 120 280 L 160 280" stroke-width="18" stroke-linecap="round"/>
    <path d="M 392 280 L 352 280" stroke-width="18" stroke-linecap="round"/>
  </g>
</svg>
